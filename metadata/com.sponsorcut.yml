License: GPL-3.0-only

AuthorName: Guy Steiff
SourceCode: https://github.com/Guy-Steiff/SponsorCut
IssueTracker: https://github.com/Guy-Steiff/SponsorCut/issues

Name: SponsorCut
AutoName: SponsorCut

RepoType: git
Repo: https://github.com/Guy-Steiff/SponsorCut

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y autoconf automake libtool pkg-config nasm cmake
        gcc gperf texinfo yasm bison autogen wget autopoint meson ninja-build
        ragel groff libtasn1-6-dev libtasn1-bin libgnutls28-dev libunistring-dev
    srclibs:
      - ffmpeg-kit@efd648489598efdc65e2e2f06ae69e065e257077
    prebuild:
      - export ANDROID_NDK_ROOT=$$NDK$$
      - cd $$ffmpeg-kit$$ && ./android.sh --lts --enable-gmp --enable-openssl
        --enable-android-media-codec --enable-android-zlib
        --disable-x86 --disable-arm-v7a --disable-arm-v7a-neon
      - cp $$ffmpeg-kit$$/bundle-android-aar-lts/ffmpeg-kit-lts.aar libs/ffmpeg-kit.aar
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
