AuthorName: Guy Steiff
SourceCode: https://github.com/Guy-Steiff/SponsorCut
IssueTracker: https://github.com/Guy-Steiff/SponsorCut/issues

Name: SponsorCut
AutoName: SponsorCut

RepoType: git
Repo: https://github.com/Guy-Steiff/SponsorCut

Builds:
  - versionName: '1.0'
    versionCode: 1
    commit: v1.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y autoconf automake libtool pkg-config nasm cmake
        gcc gperf texinfo yasm bison autogen wget autopoint meson ninja-build
        ragel groff make
    srclibs:
      - ffmpeg-kit@efd648489598efdc65e2e2f06ae69e065e257077
    prebuild:
      - export ANDROID_NDK_ROOT=$$NDK$$
      - pushd $$ffmpeg-kit$$ && ./android.sh --lts --enable-android-media-codec
        --enable-android-zlib --disable-x86 --disable-arm-v7a --disable-arm-v7a-neon
        && popd
      - mkdir -p libs
      - cp $$ffmpeg-kit$$/prebuilt/bundle-android-aar-lts/ffmpeg-kit/ffmpeg-kit.aar
        libs/ffmpeg-kit.aar
    gradle:
      - yes
    scanignore:
      - app/libs
    ndk: 25.2.9519653

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1

