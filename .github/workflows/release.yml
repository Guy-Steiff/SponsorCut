name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.2.9519653
        run: echo "y" | sdkmanager "ndk;25.2.9519653"

      - name: Install ffmpeg-kit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config nasm cmake \
            gcc gperf texinfo yasm bison autogen wget autopoint meson \
            ninja-build ragel groff make

      - name: Clone ffmpeg-kit srclib
        run: |
          git clone https://github.com/InfinityLoop1308/ffmpeg-kit.git ffmpeg-kit-src
          cd ffmpeg-kit-src
          git checkout efd648489598efdc65e2e2f06ae69e065e257077

      - name: Build ffmpeg-kit for Android
        run: |
          cd ffmpeg-kit-src
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          ./android.sh --lts \
            --enable-android-media-codec \
            --enable-android-zlib \
            --disable-x86 \
            --disable-arm-v7a \
            --disable-arm-v7a-neon

      - name: Copy ffmpeg-kit AAR into app/libs
        run: |
          mkdir -p app/libs
          find ffmpeg-kit-src/prebuilt -name ffmpeg-kit.aar -exec cp {} app/libs/ffmpeg-kit.aar \;

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp app/build/outputs/apk/release/app-release.apk SponsorCut-${VERSION}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SponsorCut-*.apk

